services:
  homeca:
    image: docker.home.arpa/homeca:latest   # `docker compose pull` to deploy without building
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8080:8080"   # UI, CRL and CA downloads (plain HTTP)
      - "8443:8443"   # ACME over HTTPS; starts once an ACME CA is selected in the UI
    volumes: ["homeca-data:/data"]
    secrets: [master_key]
    environment:
      HOMECA_MASTER_KEY_FILE: /run/secrets/master_key
      # All values come from .env (copy .env.example); see README for what each one means.
      HOMECA_PUBLIC_URL: ${HOMECA_PUBLIC_URL:?set HOMECA_PUBLIC_URL in .env (copy .env.example)}
      HOMECA_ACME_HOSTNAME: ${HOMECA_ACME_HOSTNAME:-}
      HOMECA_ACME_CLIENTS: ${HOMECA_ACME_CLIENTS:-}
      HOMECA_TRUSTED_PROXIES: ${HOMECA_TRUSTED_PROXIES:-}
      HOMECA_SECURE_COOKIE: ${HOMECA_SECURE_COOKIE:-0}
    restart: unless-stopped

secrets:
  master_key:
    file: ./master.key   # readable by uid 10001: chown 10001 master.key && chmod 400 master.key

volumes:
  homeca-data:
